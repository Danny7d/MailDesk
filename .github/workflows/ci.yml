name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: maildesk
          POSTGRES_PASSWORD: maildesk_password
          POSTGRES_DB: maildesk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U maildesk -d maildesk"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://maildesk:maildesk_password@localhost:5432/maildesk
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Integration tests
        run: npm run test:integration

      - name: Migration check
        run: |
          npm run db:generate --workspace=@maildesk/db
          # Check that migration SQL was generated
          test -n "$(find packages/db/migrations -maxdepth 1 -type f -name '0000_*.sql' -print -quit)"

      - name: Audit
        run: npm audit --audit-level=high

      - name: Build Docker images
        run: |
          docker build -f apps/api/Dockerfile -t maildesk-api:test .
          docker build -f apps/worker/Dockerfile -t maildesk-worker:test .
